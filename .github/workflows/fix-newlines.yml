name: Fix trailing newlines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip trailing newlines
        run: perl -0777 -i -pe 's/\n\z//' package.json .makefun/owner.json
      - name: Commit if changed
        run: |
          git config user.name "Rahulboss7788"
          git config user.email "Rahulboss7788@users.noreply.github.com"
          git add package.json .makefun/owner.json
          git diff --cached --quiet || git commit -m "Strip trailing newlines from package.json and .makefun/owner.json"
          git push
